name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate example config JSON
        shell: pwsh
        run: |
          Get-Content -Path .\PatchManager.config.example.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -Path .\PatchManager.config.schema.json -Raw | ConvertFrom-Json | Out-Null
          Write-Host 'Example config parses as valid JSON.'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            Write-Host 'PSScriptAnalyzer already available.'
            return
          }
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer found $($errors.Count) error(s)."
          }

      - name: Run static and fixture tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\Tests\Invoke-PatchManager.Static.Tests.ps1

      - name: Run static and fixture tests (PowerShell 7)
        shell: pwsh
        run: .\Tests\Invoke-PatchManager.Static.Tests.ps1

      - name: Validate example with runtime validator
        shell: powershell
        run: .\Invoke-PatchManager.ps1 -ValidateConfig -ConfigPath .\PatchManager.config.example.json

      - name: Check documentation and release metadata
        shell: powershell
        run: .\Tests\Test-Documentation.ps1

      - name: Build and verify public release package
        shell: powershell
        run: .\Build-Release.ps1
      - name: Test packaged files independently of the checkout
        shell: powershell
        run: |
          $archive = Get-ChildItem .\release -Filter 'PatchManager-v*.zip' | Select-Object -First 1
          $packageRoot = Join-Path $env:RUNNER_TEMP 'PatchManager-package-check'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageRoot
          & (Join-Path $packageRoot 'Tests\Invoke-PatchManager.Static.Tests.ps1')
          & (Join-Path $packageRoot 'Tests\Test-Documentation.ps1')